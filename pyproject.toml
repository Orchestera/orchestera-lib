[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestera-lib"
version = "0.1.0a9"
description = "Orchestera Library"
readme = "README.md"
requires-python = ">=3.10.14"
dependencies = [
    "PyYAML==6.0.2",
    "kubernetes==33.1.0",
    "pyspark==3.5.6",
    "click==8.1.8",
    "tenacity==9.1.2",
    "watch==0.2.7",
    "textual==0.52.1",
]

[project.optional-dependencies]
dev = ["black", "isort", "pre-commit"]
# orchestera.notebook. The runtime image pins both; job analysis uses
# Marimo's AI config internals, so Marimo stays on one minor version.
notebook = [
    "marimo[mcp]>=0.24.2,<0.25",
    "pydantic-ai-slim[anthropic,google,openai]>=2.51.0,<3",
]

# Installed by plain `uv sync` / `uv run`, so `make test` and `make release`
# run the notebook tests too -- on the runtime image's exact versions.
# pydantic-ai-slim leaves the provider SDKs unbounded, and anthropic 2.x
# breaks its 2.51 Anthropic model (BetaMessageParam became a Union).
[dependency-groups]
dev = [
    "marimo[mcp]==0.24.2",
    "pydantic-ai-slim[anthropic,google,openai]==2.51.0",
    "anthropic==1.9.0",
    "openai==3.20.0",
    "google-genai==2.25.0",
]

[project.scripts]
orchestera-tui = "orchestera.tui.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
known_first_party = ["orchestera"]
